#        three lines of it (mechanical); '+ campione' = also read by an agent (the 40 best attested).
# status: accepted = drawn; review = checks disagree or the sample check refused it, not drawn.
# weight = distinct sources stating the link (+1 across levels of the hierarchy); it picks which edges a
# hub page draws. sources: L = lecture note, O = oral-exam track, COLL = Collegamenti note.
