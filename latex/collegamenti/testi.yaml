    level: 1
    abrogato: true
  - label: h-novies)
    text: '“personale”: i dipendenti e coloro che comunque operano sulla base di rapporti che ne determinano l''inserimento
      nell''organizzazione aziendale, anche in forma diversa dal rapporto di lavoro subordinato;'
    level: 1
    abrogato: false
  - label: i)
    text: '“punto di contatto centrale”: il soggetto o la struttura designato dalle banche, dagli istituti di moneta elettronica
      o dagli istituti di pagamento dell''Unione europea che operano sul territorio della Repubblica in regime di diritto
      di stabilimento, senza succursale, tramite gli agenti di cui all''articolo 128-quater.'
    level: 1
    abrogato: false
  - label: '3.'
    text: La Banca d'Italia, può ulteriormente qualificare la definizione di stretti legami prevista dal comma 2, lettera
      h), al fine di evitare situazioni di ostacolo all'effettivo esercizio delle funzioni di vigilanza.
    level: 0
    abrogato: false
  - label: 3-bis.
    text: Se non diversamente disposto, le norme del presente decreto legislativo che fanno riferimento al consiglio di amministrazione,
