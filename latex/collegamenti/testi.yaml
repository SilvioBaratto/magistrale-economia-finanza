      4, paragrafo 1, punto 41, del regolamento (UE) n. 575/2013;
    level: 1
    abrogato: false
  - label: m)
    text: '"Ministero dell''economia e delle finanze" indica il Ministero dell''economia e delle finanze.'
    level: 1
    abrogato: true
  - label: '2.'
    text: 'Nel presente decreto legislativo si intendono per:'
    level: 0
    abrogato: false
  - label: a)
    text: '"banca italiana": la banca avente sede legale in Italia;'
    level: 1
    abrogato: false
  - label: b)
    text: '"banca dell''Unione europea": la banca avente sede legale e amministrazione centrale in un medesimo Stato dell''Unione
