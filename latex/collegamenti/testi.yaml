    level: 1
    abrogato: false
  - label: c)
    text: '“banca di Stato terzo”: ogni impresa avente sede legale in uno Stato terzo in cui è autorizzata a prestare una
      o più attività per le quali, se fosse stabilita in Italia, dovrebbe essere autorizzata ai sensi dell''articolo 14 o
      dell''articolo 20- bis.1 del decreto legislativo 24 febbraio 1998, n. 58;'
    level: 1
    abrogato: false
  - label: d)
    text: '“soggetto significativo”: i soggetti definiti dall''articolo 2, n. 16, del regolamento (UE) n. 468/2014, sui quali
      la BCE esercita la vigilanza diretta in conformità delle disposizioni del MVU;'
    level: 1
    abrogato: false
  - label: d-bis)
