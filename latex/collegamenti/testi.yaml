COST:117:
  fonte: Costituzione della Repubblica italiana
  rubrica: ''
  vigore: ''
  par:
  - label: '1.'
    text: La potestà legislativa è esercitata dallo Stato e dalle Regioni nel rispetto della Costituzione, nonché dei vincoli
      derivanti dall'ordinamento comunitario e dagli obblighi internazionali.
    level: 0
    abrogato: false
  - label: '2.'
    text: 'Lo Stato ha legislazione esclusiva nelle seguenti materie:'
    level: 0
    abrogato: false
  - label: a)
    text: politica estera e rapporti internazionali dello Stato; rapporti dello Stato con l'Unione europea; diritto di asilo
      e condizione giuridica dei cittadini di Stati non appartenenti all'Unione europea;
    level: 1
    abrogato: false
  - label: b)
    text: immigrazione;
    level: 1
    abrogato: false
  - label: c)
    text: rapporti tra la Repubblica e le confessioni religiose;
    level: 1
    abrogato: false
  - label: d)
    text: difesa e Forze armate; sicurezza dello Stato; armi, munizioni ed esplosivi;
    level: 1
    abrogato: false
  - label: e)
    text: moneta, tutela del risparmio e mercati finanziari; tutela della concorrenza; sistema valutario; sistema tributario
      e contabile dello Stato; armonizzazione dei bilanci pubblici; perequazione delle risorse finanziarie;
    level: 1
    abrogato: false
  - label: f)
    text: organi dello Stato e relative leggi elettorali; referendum statali; elezione del Parlamento europeo;
    level: 1
    abrogato: false
  - label: g)
    text: ordinamento e organizzazione amministrativa dello Stato e degli enti pubblici nazionali;
    level: 1
    abrogato: false
  - label: h)
    text: ordine pubblico e sicurezza, ad esclusione della polizia amministrativa locale;
    level: 1
    abrogato: false
  - label: i)
    text: cittadinanza, stato civile e anagrafi;
    level: 1
    abrogato: false
  - label: l)
    text: giurisdizione e norme processuali; ordinamento civile e penale; giustizia amministrativa;
    level: 1
    abrogato: false
  - label: m)
    text: determinazione dei livelli essenziali delle prestazioni concernenti i diritti civili e sociali che devono essere
      garantiti su tutto il territorio nazionale;
    level: 1
    abrogato: false
  - label: n)
    text: norme generali sull'istruzione;
    level: 1
    abrogato: false
  - label: o)
    text: previdenza sociale;
    level: 1
    abrogato: false
  - label: p)
    text: legislazione elettorale, organi di governo e funzioni fondamentali di Comuni, Province e Città metropolitane;
    level: 1
    abrogato: false
  - label: q)
    text: dogane, protezione dei confini nazionali e profilassi internazionale;
    level: 1
    abrogato: false
  - label: r)
    text: pesi, misure e determinazione del tempo; coordinamento informativo statistico e informatico dei dati dell'amministrazione
      statale, regionale e locale; opere dell'ingegno;
    level: 1
    abrogato: false
  - label: s)
    text: tutela dell'ambiente, dell'ecosistema e dei beni culturali.
    level: 1
    abrogato: false
  - label: '3.'
    text: 'Sono materie di legislazione concorrente quelle relative a: rapporti internazionali e con l''Unione europea delle
      Regioni; commercio con l''estero; tutela e sicurezza del lavoro; istruzione, salva l''autonomia delle istituzioni scolastiche
      e con esclusione della istruzione e della formazione professionale; professioni; ricerca scientifica e tecnologica e
      sostegno all''innovazione per i settori produttivi; tutela della salute; alimentazione; ordinamento sportivo; protezione
      civile; governo del territorio; porti e aeroporti civili; grandi reti di trasporto e di navigazione; ordinamento della
      comunicazione; produzione, trasporto e distribuzione nazionale dell''energia; previdenza complementare e integrativa;
      coordinamento della finanza pubblica e del sistema tributario; valorizzazione dei beni culturali e ambientali e promozione
      e organizzazione di attività culturali; casse di risparmio, casse rurali, aziende di credito a carattere regionale;
      enti di credito fondiario e agrario a carattere regionale. Nelle materie di legislazione concorrente spetta alle Regioni
      la potestà legislativa, salvo che per la determinazione dei princìpi fondamentali, riservata alla legislazione dello
      Stato.'
    level: 0
    abrogato: false
  - label: '4.'
    text: Spetta alle Regioni la potestà legislativa in riferimento ad ogni materia non espressamente riservata alla legislazione
      dello Stato.
    level: 0
    abrogato: false
  - label: '5.'
    text: Le Regioni e le Province autonome di Trento e di Bolzano, nelle materie di loro competenza, partecipano alle decisioni
      dirette alla formazione degli atti normativi comunitari e provvedono all'attuazione e all'esecuzione degli accordi internazionali
      e degli atti dell'Unione europea, nel rispetto delle norme di procedura stabilite da legge dello Stato, che disciplina
      le modalità di esercizio del potere sostitutivo in caso di inadempienza.
    level: 0
    abrogato: false
  - label: '6.'
    text: La potestà regolamentare spetta allo Stato nelle materie di legislazione esclusiva, salva delega alle Regioni. La
      potestà regolamentare spetta alle Regioni in ogni altra materia. I Comuni, le Province e le Città metropolitane hanno
      potestà regolamentare in ordine alla disciplina dell'organizzazione e dello svolgimento delle funzioni loro attribuite.
    level: 0
    abrogato: false
  - label: '7.'
    text: Le leggi regionali rimuovono ogni ostacolo che impedisce la piena parità degli uomini e delle donne nella vita sociale,
      culturale ed economica e promuovono la parità di accesso tra donne e uomini alle cariche elettive.
    level: 0
    abrogato: false
  - label: '8.'
    text: La legge regionale ratifica le intese della Regione con altre Regioni per il migliore esercizio delle proprie funzioni,
      anche con individuazione di organi comuni .
    level: 0
    abrogato: false
  - label: '9.'
    text: Nelle materie di sua competenza la Regione può concludere accordi con Stati e intese con enti territoriali interni
      ad altro Stato, nei casi e con le forme disciplinati da leggi dello Stato.
    level: 0
    abrogato: false
COST:41:
  fonte: Costituzione della Repubblica italiana
  rubrica: ''
  vigore: ''
  par:
  - label: '1.'
    text: L'iniziativa economica privata è libera.
    level: 0
    abrogato: false
  - label: '2.'
    text: Non può svolgersi in contrasto con la utilità sociale o in modo da recare danno alla salute, all'ambiente, alla
      sicurezza, alla libertà, alla dignità umana.
    level: 0
    abrogato: false
  - label: '3.'
    text: La legge determina i programmi e i controlli opportuni perché l'attività economica pubblica e privata possa essere
      indirizzata e coordinata a fini sociali e ambientali.
    level: 0
    abrogato: false
COST:47:
  fonte: Costituzione della Repubblica italiana
  rubrica: ''
  vigore: ''
  par:
  - label: '1.'
    text: La Repubblica incoraggia e tutela il risparmio in tutte le sue forme; disciplina, coordina e controlla l'esercizio
      del credito.
    level: 0
    abrogato: false
  - label: '2.'
    text: Favorisce l'accesso del risparmio popolare alla proprietà dell'abitazione, alla proprietà diretta coltivatrice e
      al diretto e indiretto investimento azionario nei grandi complessi produttivi del Paese.
    level: 0
    abrogato: false
TUB:1:
  fonte: TUB (d.lgs. 385/1993), testo consolidato al 22 gennaio 2026
  rubrica: Definizioni
  vigore: 9 gennaio 2026
  par:
  - label: '1.'
    text: 'Nel presente decreto legislativo l''espressione:'
    level: 0
    abrogato: false
  - label: a)
    text: '"autorità creditizie" indica il Comitato interministeriale per il credito e il risparmio, il Ministro dell''economia
      e delle finanze e la Banca d''Italia;'
    level: 1
    abrogato: false
  - label: a-bis)
    text: “autorità di risoluzione” indica la Banca d'Italia o il Comitato di Risoluzione Unico stabilito dal regolamento
      (UE) n. 806/2014 del Parlamento europeo e del Consiglio, nell'ambito del riparto di competenze definite dal medesimo
      regolamento, nonché un'autorità non italiana deputata allo svolgimento delle funzioni di risoluzione;
    level: 1
    abrogato: false
  - label: b)
    text: '"banca" indica l''impresa autorizzata all''esercizio dell''attività bancaria;'
    level: 1
    abrogato: false
  - label: b-bis)
    text: «BCE» indica la Banca centrale europea;
    level: 1
    abrogato: false
  - label: c)
    text: '"CICR" indica il Comitato interministeriale per il credito e il risparmio;'
    level: 1
    abrogato: false
  - label: d)
    text: '"CONSOB" indica la Commissione nazionale per le società e la borsa;'
    level: 1
    abrogato: false
  - label: d-bis)
    text: '"COVIP" indica la commissione di vigilanza sui fondi pensione;'
    level: 1
    abrogato: false
  - label: e)
    text: “IVASS” indica l'Istituto per la vigilanza sulle assicurazioni;
    level: 1
    abrogato: false
  - label: e-bis)
    text: “MVU” indica il Meccanismo di vigilanza unica, ossia il sistema di vigilanza finanziaria composto dalla BCE e dalle
      autorità nazionali competenti degli Stati membri che vi partecipano;
    level: 1
    abrogato: false
  - label: e-ter)
    text: “Disposizioni del MVU” indica il regolamento (UE) n. 1024/2013 e le relative misure di esecuzione;
    level: 1
    abrogato: false
  - label: e-quater)
    text: «UIF» indica l'Unità di informazione finanziaria per l'Italia di cui all'articolo 6 del decreto legislativo 21 novembre
      2007, n. 231;
    level: 1
    abrogato: false
  - label: e-quinquies)
    text: '«MRU»: indica il Meccanismo di risoluzione unico, ossia il sistema di risoluzione istituito ai sensi del regolamento
      (UE) n. 806/2014, del Parlamento europeo e del Consiglio, composto dal Comitato di Risoluzione Unico e dalle autorità
      nazionali di risoluzione degli Stati membri che vi partecipano;'
    level: 1
    abrogato: false
  - label: f)
    text: '"UIC" indica l''Ufficio italiano dei cambi;'
    level: 1
    abrogato: true
  - label: g)
    text: '"Stato dell''Unione europea" indica lo Stato membro dell''Unione europea;'
    level: 1
    abrogato: false
  - label: g-bis)
    text: “Stato di origine” indica lo Stato dell'Unione europea in cui la banca, l'IMEL o l'IP è stato autorizzato all'esercizio
      dell'attività;
    level: 1
    abrogato: false
  - label: g-ter)
    text: “Stato ospitante” indica lo Stato dell'Unione europea nel quale la banca, l'IMEL o l'IP ha una succursale o presta
      servizi;
    level: 1
    abrogato: false
  - label: h)
    text: “Stato terzo” indica lo Stato non membro dell'Unione europea;
    level: 1
    abrogato: false
  - label: h-bis)
    text: '"SEVIF": il Sistema europeo di vigilanza finanziaria composto dalle seguenti parti:'
    level: 1
    abrogato: false
  - label: 1)
    text: '"ABE": Autorità bancaria europea, istituita con regolamento (UE) n. 1093/2010;'
    level: 2
    abrogato: false
  - label: 2)
    text: '"AEAP": Autorità europea delle assicurazioni e delle pensioni aziendali e professionali, istituita con regolamento
      (UE) n. 1094/2010;'
    level: 2
    abrogato: false
  - label: 3)
    text: '"AESFEM": Autorità europea degli strumenti finanziari e dei mercati, istituita con regolamento (UE) n. 1095/2010;'
    level: 2
    abrogato: false
  - label: 4)
    text: '"Comitato congiunto": il Comitato congiunto delle Autorità europee di vigilanza, previsto dall''articolo 54 del
      regolamento (UE) n. 1093/2010, del regolamento (UE) n. 1094/2010, del regolamento (UE) n. 1095/2010;'
    level: 2
    abrogato: false
  - label: 5)
    text: '"CERS": Comitato europeo per il rischio sistemico, istituito dal regolamento (UE) n. 1092/2010;'
    level: 2
    abrogato: false
  - label: 6)
    text: '"Autorità di vigilanza degli Stati membri": le autorità competenti o di vigilanza degli Stati membri specificate
      negli atti dell''Unione di cui all''articolo 1, paragrafo 2, del regolamento (UE) n. 1093/2010, del regolamento (UE)
      n. 1094/2010 e del regolamento (UE) n. 1095/2010;'
    level: 2
    abrogato: false
  - label: h-ter)
    text: “Stato partecipante al MVU” indica uno Stato dell'Unione europea la cui moneta è l'euro o che abbia instaurato una
      cooperazione stretta con la BCE a norma delle disposizioni del MVU;
    level: 1
    abrogato: false
  - label: i)
    text: '"legge fallimentare" indica il regio decreto 16 marzo 1942, n. 267.'
    level: 1
    abrogato: false
  - label: l)
    text: '"autorità competenti" indica, a seconda dei casi, uno o più fra le autorità di vigilanza sulle banche, sulle imprese
      di investimento, sugli organismi di investimento collettivo del risparmio, sulle imprese di assicurazione e sui mercati
      finanziari;'
    level: 1
